name: Pull Request Validation

on:
  pull_request:
    branches:
      - master

env:
  HUSKY: 0

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --runtime win-x64

      # Code style (EnforceCodeStyleInBuild) and analyzer errors from .editorconfig fail here.
      # The installer project is excluded: its Release build requires publish output, which is not produced on pull requests.
      - name: Build
        run: dotnet build "Radio Automation\Radio Automation.csproj" --no-restore --configuration Release

      - name: Test
        run: dotnet test --project '.\Tests\RadioAutomation.Tests\RadioAutomation.Tests.csproj' --configuration Release --no-restore --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Test Results"
          path: "./TestResults/*.trx"
